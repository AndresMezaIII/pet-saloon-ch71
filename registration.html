<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--bootstrap css-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--custom css -->
    <link rel="stylesheet" href="styles/registration.css" />
    <title>Registration</title>
  </head>
  <body>
    <!--bootstrap nav-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Pet Saloon</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!---->

    <h1>Registration</h1>
<!--pet registration area-->
    <section>
      <h2 class="regHead2">Registered Pets</h2>
      <hr />
      <div id="regPets"></div>

    <!--pet registration form-->
      <form id="registrationForm">
        <fieldset>
        <label for="name">Pet Name: </label>
        <input type="text" name="name" id="name">
        <label for="gender">Pet Gender: </label>
        <select name="gender" id="gender" for="gender">
          <option value="" disabled selected>Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        </fieldset>
        <fieldset>
        <label for="age">Pet Age: </label>
        <input type="number" name="age" id="age">
        <label for="breed">Breed: </label>
        <input type="text" name="breed" id="breed">
        </fieldset>
        <fieldset>
          <label for="services">Service: </label>
          <select name="services" id="services">
            <option value="" selected disabled>Service</option>
            <option value="nail-clipping">Nail Clipping</option>
            <option value="coat-grooming">Coat Grooming</option>
            <option value="bath">Bath</option>
            <option value="teeth">Teeth Cleaning</option>
          </select>
        </fieldset>
        <fieldset>
          <label for="email">
            E-mail: 
          </label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </fieldset>
      </form>
      <button id="res-btn" onclick="addPet()">Reserve</button>
    </section>

    <!--bootstrap js-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!--customJS-->
    <script src="scripts/registration.js" defer></script>
  </body>
</html>
