<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Services</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Pet Saloon</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <h1>Services</h1>
    <section class="m-5 mb-5">
      <form
        class="bg-light m-3 d-flex flex-wrap flex-column p-4 border rounded"
      >
        <label class="form-label">Service:</label>
        <input
          type="text"
          id="serviceInput"
          class="form-control"
          placeholder="Premium Bath"
        />

        <label class="form-label">Description:</label>
        <input
          type="text"
          id="descriptionInput"
          class="form-control"
          placeholder="A wonderful bubble bath"
        />

        <label>Price:</label>
        <input
          type="number"
          id="priceInput"
          class="form-control"
          step="any"
          value=""
        />

        <div class="d-flex justify-content-end gap-3">
          <button
            type="submit"
            id="registerService"
            class="m-2 p-2 btn btn-sm btn-primary"
          >
            Add Service
          </button>
          <button id="clearForm" type="reset" class="m-2 p-2 btn btn-sm btn-secondary">
            Clear
          </button>
        </div>
      </form>
    </section>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="scripts/services.js"></script>
  </body>
</html>
