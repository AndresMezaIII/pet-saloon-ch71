<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/105-localstorage.css" />
    <title>Local Storage</title>
  </head>
  <body>
    <main class="mb-3">
      <h1>Local Storage: Save, Get, and Delete Data</h1>

      <form class="form-control bg-light">
        <div class="mb-3 d-flex justify-content-center input-group">
          <label class="input-group-text">Username: </label>
          <input
            class="form-control"
            id="username"
            type="text"
            placeholder="myHandle"
          />
        </div>
        <div class="d-flex justify-content-end gap-4">
          <button class="btn btn-sm btn-primary" id="saveBtn">Save</button>
          <button class="btn btn-sm btn-secondary" id="getBtn">Get</button>
          <button class="btn btn-sm btn-danger" id="deleteBtn">Delete</button>
        </div>
      </form>
    </main>
    <div class="container mt-5 bg-light p-2">
      <h2>Saved Data</h2>
      <p id="result"></p>
    </div>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>

    <script src="scripts/105-localstorage.js"></script>
  </body>
</html>
