<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--bootstrap css-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--custom css -->
    <link rel="stylesheet" href="styles/registration.css" />
    <title>Registration</title>
  </head>
  <body>
    <!--bootstrap nav-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-success-subtle">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Pet Saloon</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!---->

    <h1>Registration</h1>
    <!--pet registration area-->
    <section>
      <h2 class="regHead2">Registered Pets</h2>
      <hr />
      <div id="regPets"></div>
      <div id="salon-info"></div>
      <form class="bg-success-subtle p-3 m-3 border border-rounded" id="form">
        <div class="input-group mb-3 d-flex">
          <span for="name" class="input-group-text" id="basic-addon1"
            >Name:
          </span>
          <input
            type="text"
            name="name"
            placeholder="Dr. Fetch"
            class="form-control"
            id="tdOne"
          />
        </div>
        <div class="input-group mb-3 d-flex">
          <span
            for="age"
            class="input-group-text"
            id="basic-addon1 visible-addon"
            >Age:
          </span>
          <input
            type="numeric"
            value="3"
            name="age"
            class="form-control"
            id="tdTwo"
          />
        </div>
        <div class="input-group mb-3 d-flex">
          <span
            type="breed"
            for="breed"
            class="input-group-text"
            id="basic-addon2 visible-addon"
            >Breed:
          </span>
          <input
            type="text"
            name="breed"
            placeholder="Lhasa Apso"
            class="form-control"
            id="tdThree"
          />
        </div>
        <div class="input-group mb-3 d-flex">
          <span for="gender" class="input-group-text" id="basic-addon1"
            >Gender:
          </span>
          <select class="form-select" id="tdFour">
            <option value="" selected disabled>Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="input-group d-flex">
          <span for="service" class="input-group-text mb-3" id="basic-addon1"
            >Service:</span
          >
          <select class="form-select mb-3" id="tdFive">
            <option value="" selected disabled>Service</option>
            <option value="Full Service">Full Service</option>
            <option value="Nails">Nails</option>
            <option value="Teeth">Teeth</option>
            <option value="Coat Grooming">Coat Grooming</option>
            <option value="Ears">Ears</option>
          </select>
        </div>
        <div class="d-flex justify-content-end gap-1">
          <br /><br />
          <button
            type="submit"
            class="btn btn-primary btn-sm"
            onclick="displayRow(event)"
          >
            Register
          </button>
          <button type="reset" class="btn btn-secondary btn-sm">Clear</button>
        </div>
      </form>
    </section>
    <!--table area-->
    <section id="sectionTwo">
      <table class="table table-success table-striped-columns gap-2 m-3 p-3">
        <thead>
          <tr>
            <th>Name:</th>
            <th>Age:</th>
            <th>Breed:</th>
            <th>Gender:</th>
            <th>Service:</th>
            <th>Manage Reservation:</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <!--bootstrap js-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!--customJS-->
    <script src="scripts/registration.js" defer></script>
  </body>
</html>
